services:
  - type: web
    name: optimum-travel-mapping-api
    env: python
    region: ohio
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: NOAA_USER_AGENT
        value: OptimumTravelMapping/1.0 (github.com/Codesurfing10)
      - key: PYTHON_VERSION
        value: 3.11.0
